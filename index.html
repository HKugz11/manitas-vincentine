<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manitas Vincentine</title>
  <meta name="description" content="Helados, toppings, crepes, precios y horario. Ice cream, toppings, crepes, prices and hours.">
  <meta name="theme-color" content="#f7e3a3">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <div class="band">
    <header class="top">
      <div class="brand"><img src="icon.svg" alt="" class="logo"> <span id="shop-name"></span></div>
      <div id="lang" class="lang" data-lang="es" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>
  </div>
  <div class="drip" aria-hidden="true"></div>

  <main class="wrap">
    <!-- public view -->
    <section id="view-public">
      <div id="banner" class="banner hidden"></div>

      <div id="status" class="status loading">
        <span class="dot"></span>
        <div>
          <div id="status-text" class="status-text" data-i18n="loading">Cargando…</div>
          <div id="status-note" class="status-note"></div>
          <div id="updated" class="status-updated"></div>
        </div>
      </div>

      <h2 class="section-title" data-i18n="flavorsToday">Sabores del día</h2>
      <ul id="flavors" class="menu"></ul>

      <div id="toppings-wrap" class="hidden">
        <h2 class="section-title" data-i18n="toppings">Toppings</h2>
        <ul id="toppings" class="menu toppings"></ul>
      </div>

      <div id="crepes-wrap" class="hidden">
        <h2 class="section-title" data-i18n="crepes">Crepes</h2>
        <ul id="crepes" class="menu crepes"></ul>
      </div>

      <div id="prices-wrap">
        <h2 class="section-title" data-i18n="prices">Precios</h2>
        <ul id="prices" class="prices"></ul>
      </div>

      <div id="socials-wrap" class="hidden">
        <h2 class="section-title" data-i18n="reviewUs">¿Te gustó? ¡Déjanos tu reseña!</h2>
        <div id="socials" class="socials"></div>
      </div>

      <p id="hours" class="hours"></p>
      <div class="foot"><button id="btn-nubia" class="quiet" data-i18n="iamNubia">Soy Nubia</button></div>
    </section>

    <!-- editor (Nubia only) -->
    <section id="view-edit" class="hidden">
      <h1 class="editor-title" data-i18n="editorTitle"></h1>
      <p class="hint" data-i18n="bothHint"></p>

      <div class="card">
        <div class="row between">
          <div>
            <div class="label" data-i18n="shopStatus"></div>
            <div id="edit-open-label" class="big"></div>
          </div>
          <button id="edit-open" class="toggle" role="switch" aria-checked="true" data-i18n-aria="openClosed"><span></span></button>
        </div>
        <div class="field">
          <label data-i18n="message"></label>
          <div class="bi" id="edit-note"></div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="flavorsToday"></h2>
        <ul id="edit-flavors" class="edit-list"></ul>
        <button type="button" id="add-flavor" class="addbtn" data-i18n="addFlavor"></button>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="toppings"></h2>
        <ul id="edit-toppings" class="edit-list toppings"></ul>
        <button type="button" id="add-topping" class="addbtn" data-i18n="addTopping"></button>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="crepes"></h2>
        <ul id="edit-crepes" class="edit-list crepes"></ul>
        <button type="button" id="add-crepe" class="addbtn" data-i18n="addCrepe"></button>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="prices"></h2>
        <ul id="edit-prices" class="edit-list"></ul>
        <button type="button" id="add-price" class="addbtn" data-i18n="addPrice"></button>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="banner"></h2>
        <p class="hint small" data-i18n="bannerHint"></p>
        <div id="edit-banner"></div>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="socials"></h2>
        <p class="hint small" data-i18n="socialsHint"></p>
        <div id="edit-socials" class="bi"></div>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="shopInfo"></h2>
        <div class="field first">
          <label data-i18n="shopName"></label>
          <div class="bi" id="edit-shop"></div>
        </div>
        <div class="field">
          <label data-i18n="hours"></label>
          <div class="bi" id="edit-hours"></div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title" data-i18n="qrCard"></h2>
        <p class="hint small" data-i18n="qrHint"></p>
        <button type="button" id="open-qr" class="addbtn" data-i18n="qrOpen"></button>
      </div>

      <footer class="savebar">
        <button id="btn-logout" class="link" data-i18n="logout"></button>
        <span id="save-msg" class="save-msg"></span>
        <button id="btn-save" class="primary" data-i18n="save" disabled></button>
      </footer>
    </section>
  </main>

  <!-- password popup -->
  <div id="login" class="modal hidden">
    <form id="login-form" class="authbox">
      <h1 data-i18n="hi"></h1>
      <p class="tag" data-i18n="loginTag"></p>
      <div class="field">
        <label for="login-pw" data-i18n="password"></label>
        <input id="login-pw" type="password" autocomplete="current-password">
      </div>
      <div id="login-msg" class="err"></div>
      <div class="row">
        <button type="button" id="login-cancel" data-i18n="cancel"></button>
        <button type="submit" class="primary" id="login-go" data-i18n="unlock"></button>
      </div>
    </form>
  </div>

  <!-- photo viewer -->
  <div id="viewer" class="modal hidden"><img id="viewer-img" alt=""></div>

  <script src="config.js?v=2.0"></script>
  <script src="i18n.js?v=2.0"></script>
  <script src="crypto.js?v=2.0"></script>
  <script src="app.js?v=2.0"></script>
</body>
</html>
